server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Обработка API запросов - прокси на бэкенд
    location /api/ {
        proxy_pass https://homehub-back-latest.onrender.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host homehub-back-latest.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты для долгих запросов
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Обработка SPA - все запросы отдаем index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статические файлы (кеширование)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # favicon.ico - если нет, возвращаем 204 (No Content)
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }

    # Обработка ошибок
    error_page 404 /index.html;
}