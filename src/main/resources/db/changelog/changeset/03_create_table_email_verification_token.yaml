databaseChangeLog:
  - changeSet:
      id: 4
      author: oleg
      changes:
        - createTable:
            tableName: email_verification_token
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: token
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    referencedTableName: users
                    referencedColumnNames: id
                    foreignKeyName: email_verification_user
                    nullable: false
                    unique: true
