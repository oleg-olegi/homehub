databaseChangeLog:
  - changeSet:
      id: 1
      author: olegshinkevich
      changes:
        - createTable:
            tableName: income
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: users_id
                  type: bigint
                  constraints:
                    nullable: false
                    referencedTableName: users
                    referencedColumnNames: id
                    foreignKeyName: fk_expense_user
                    deleteCascade: true
              - column:
                  name: amount
                  type: numeric
                  constraints:
                    nullable: false
              - column:
                  name: date
                  type: date

