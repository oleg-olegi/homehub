databaseChangeLog:
  - changeSet:
      id: 1
      author: olegshinkevich
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: users_name
                  type: text
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email
                  type: varchar(128)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: role
                  type: varchar (24)
                  defaultValue: 'USER'
              - column:
                  name: password
                  type: text
                  constraints:
                    nullable: false

