spring:
  application:
    name: homeHub
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres_db
    username: postgres_user
    password: postgres_password
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: update
  mail:
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    host: smtp-relay.brevo.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
app:
  verification-url: "http://localhost:8080/api/v1/auth/verify"
jwt:
  secret: "local-secret-secret-secret-secret-egavaefvgaefgva"
  expiration: 3600000

logging:
  level:
    org.springframework.security: INFO